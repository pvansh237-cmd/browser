# Optional: Render "Blueprint". You can also create the service by hand (see README).
services:
  - type: web
    name: remote-screen
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: TURNIX_API_TOKEN  # Turnix.io API token
        sync: false
      - key: TURNIX_REGION     # optional, e.g. eu-central
        sync: false
      - key: TURN_API_URL      # (other providers) credentials API URL
        sync: false
      - key: TURN_URL          # OR static: turn:host:3478?transport=udp,turn:host:3478?transport=tcp
        sync: false
      - key: TURN_USER
        sync: false
      - key: TURN_PASS
        sync: false
