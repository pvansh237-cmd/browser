<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Remote Screen Viewer</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0f1117;
    color: #e6e6e6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header { padding: 18px; text-align: center; }
  header h1 { margin: 0; font-size: 22px; color: #4fd1c5; }
  header p { margin: 4px 0 0; color: #9aa0a6; font-size: 13px; }

  #joinBox {
    background: #1a1d27; padding: 24px 28px; border-radius: 12px;
    display: flex; flex-direction: column; gap: 12px; width: 260px; margin-top: 40px;
  }
  #joinBox input {
    padding: 10px 12px; border-radius: 8px; border: 1px solid #333;
    background: #0f1117; color: #fff; font-size: 16px; letter-spacing: 2px; text-align: center;
  }
  #joinBox button {
    padding: 10px; border: none; border-radius: 8px; background: #4fd1c5;
    color: #0f1117; font-weight: bold; cursor: pointer; font-size: 15px;
  }
  #joinBox button:hover { background: #38b2ac; }
  #status { font-size: 13px; color: #f56565; min-height: 16px; text-align: center; }

  #viewerWrap { display: none; width: 100%; flex: 1; flex-direction: column; align-items: center; }
  #toolbar { display: flex; gap: 8px; margin-bottom: 8px; }
  #toolbar button {
    padding: 6px 12px; border-radius: 6px; border: 1px solid #333; background: #1a1d27;
    color: #e6e6e6; cursor: pointer; font-size: 13px;
  }
  #toolbar button:hover { background: #2d3142; }
  #videoHolder {
    position: relative; max-width: 95vw; border: 2px solid #4fd1c5; border-radius: 8px;
    overflow: hidden; cursor: crosshair; background: #000;
  }
  video { display: block; max-width: 95vw; max-height: 80vh; outline: none; background: #000; }
  #videoHolder:fullscreen { border: none; border-radius: 0; display: flex; align-items: center; justify-content: center; width: 100vw; height: 100vh; max-width: none; }
  #videoHolder:fullscreen video { max-width: 100vw; max-height: 100vh; }
  #hint { font-size: 12px; color: #9aa0a6; margin: 8px 0 0; }
  #connState { font-size: 13px; color: #4fd1c5; margin: 4px 0 0; }
  #connState.warn { color: #f6ad55; }
  #connState.bad { color: #f56565; }
  #stats { font-size: 11px; color: #6b7280; margin: 2px 0 0; min-height: 14px; }
</style>
</head>
<body>
  <header>
    <h1>🖥️ Remote Screen Control</h1>
    <p>No install, no login — direct peer-to-peer connection.</p>
  </header>

  <div id="joinBox">
    <input id="pinInput" type="text" inputmode="numeric" autocomplete="off" placeholder="Enter 6-digit PIN" maxlength="6" />
    <button id="joinBtn">Connect</button>
    <div id="status"></div>
  </div>

  <div id="viewerWrap">
    <div id="toolbar">
      <button id="fsBtn">⛶ Fullscreen</button>
      <button id="discBtn">✖ Disconnect</button>
    </div>
    <div id="videoHolder">
      <video id="screen" autoplay playsinline muted tabindex="0"></video>
    </div>
    <p id="hint">Click on the screen to focus, then use mouse, scroll &amp; keyboard to control remotely.</p>
    <p id="connState"></p>
    <p id="stats"></p>
  </div>

  <script src="client.js"></script>
</body>
</html>
